workflow:
  rules:
    # Avoid duplicate pipelines: the branch pipeline already runs the jobs,
    # so don't also create a merge request pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
- artifacts
- validate
- build-and-push

default:
  tags:
    - alexos-self-runner

variables:
  ALEXOS_CLI_PROJECT_ID: "77029455"
  IMAGE_NAME: "al3xos/ci-tools"
  BUILD_CACHE_REF: "al3xos/ci-tools:buildcache"

download-alexos-cli:
  stage: artifacts
  image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      RESPONSE=$(curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${ALEXOS_CLI_PROJECT_ID}/packages?package_name=alexos-cli&order_by=created_at&sort=desc&per_page=1")
      LATEST_VERSION=$(echo "${RESPONSE}" | jq -r 'if type == "array" then .[0].version else .version end')
      echo "Using alexos-cli version: ${LATEST_VERSION}"
      mkdir -p ${CI_PROJECT_DIR}/bin
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output ${CI_PROJECT_DIR}/bin/alexos-cli "${CI_API_V4_URL}/projects/${ALEXOS_CLI_PROJECT_ID}/packages/generic/alexos-cli/${LATEST_VERSION}/alexos-cli-linux-amd64"
      chmod +x ${CI_PROJECT_DIR}/bin/alexos-cli
  artifacts:
    paths:
      - ${CI_PROJECT_DIR}/bin/alexos-cli
    untracked: false
    when: on_success
    expire_in: "1 day"

# Branches: build the whole image (including the tool version check at the end
# of the Dockerfile) without pushing, so a bad version bump fails here, not on main.
# Reads the registry cache but doesn't write it.
validate:
  stage: validate
  needs:
    - download-alexos-cli
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  image:
    name: moby/buildkit:rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
    entrypoint: [""]
  script:
    - |
      buildctl-daemonless.sh build \
        --progress=plain \
        --frontend=dockerfile.v0 \
        --local context=${CI_PROJECT_DIR} \
        --local dockerfile=${CI_PROJECT_DIR} \
        --opt filename=Dockerfile \
        --import-cache type=registry,ref=${BUILD_CACHE_REF}

build-and-push:
  stage: build-and-push
  needs:
    - download-alexos-cli
  variables:
    KUBERNETES_CPU_REQUEST: "0.5"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  image:
    name: moby/buildkit:rootless@sha256:f68752a5a94acfcdad2d07867b7075601a421638e17fc5f28efc1c814d0c4f89
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.docker
    - creds=$(echo -n "al3xos:${DOCKER_CREDS}" | base64 | tr -d '\n')
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${creds}\"}}}" > ~/.docker/config.json
  script:
    - |
      set -eu
      # The image is tagged with the gcloud version it contains
      IMAGE_TAG=$(sed -n 's/^ARG GCLOUD_VERSION=//p' ${CI_PROJECT_DIR}/Dockerfile)
      if [ -z "${IMAGE_TAG}" ]; then
        echo "Could not read GCLOUD_VERSION from the Dockerfile"
        exit 1
      fi
      BUILD_STARTED_AT=$(date +%s)
      echo "Build started at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "Building image [${IMAGE_NAME}:${IMAGE_TAG}]"
      echo "Using registry cache [${BUILD_CACHE_REF}]"
      buildctl-daemonless.sh build \
        --progress=plain \
        --frontend=dockerfile.v0 \
        --local context=${CI_PROJECT_DIR} \
        --local dockerfile=${CI_PROJECT_DIR} \
        --opt filename=Dockerfile \
        --import-cache type=registry,ref=${BUILD_CACHE_REF} \
        --export-cache type=registry,ref=${BUILD_CACHE_REF},mode=max,compression=zstd \
        --output "type=image,\"name=${IMAGE_NAME}:${IMAGE_TAG},${IMAGE_NAME}:latest\",push=true,compression=zstd,oci-mediatypes=true"
      BUILD_FINISHED_AT=$(date +%s)
      echo "Build finished at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      echo "Build duration: $((BUILD_FINISHED_AT - BUILD_STARTED_AT)) seconds"
